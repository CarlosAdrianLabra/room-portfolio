<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon/favicon-48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon/favicon-96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon/favicon-192.png"
    />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <meta name="theme-color" content="#32343c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room portafolio</title>
  </head>
  <body>
    <div id="app"></div>
    <div
      id="carga"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-label="Loading"
    >
      <svg class="carga__alambre" viewBox="0 0 160 90" aria-hidden="true">
        <path data-trazo d="M80,26 L112,45 L80,64 L48,45 Z" pathLength="100" />
        <path data-trazo d="M80,26 L48,45 L48,25 L80,6" pathLength="100" />
        <path data-trazo d="M80,26 L112,45 L112,25 L80,6" pathLength="100" />
      </svg>

      <span id="carga-pct" class="carga__pct">0%</span>

      <button id="btn-entrar" type="button" hidden>Enter</button>
    </div>
    <div id="experience">
      <canvas id="experience-canvas" class="experience-canvas"></canvas>
    </div>

    <div
      class="modal"
      data-modal="work"
      role="dialog"
      aria-modal="true"
      aria-labelledby="t-work"
      hidden
    >
      <article class="panel">
        <header class="panel__cabecera">
          <h2 class="panel__titulo" id="t-work">Work</h2>
          <button
            class="panel__cerrar"
            type="button"
            data-cerrar
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div class="panel__cuerpo" id="work-lista"></div>
      </article>
    </div>

    <div
      class="modal"
      data-modal="about"
      role="dialog"
      aria-modal="true"
      aria-labelledby="t-about"
      hidden
    >
      <article class="panel">
        <header class="panel__cabecera">
          <h2 class="panel__titulo" id="t-about">About</h2>
          <button
            class="panel__cerrar"
            type="button"
            data-cerrar
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div class="panel__cuerpo" id="about-cuerpo"></div>
      </article>
    </div>

    <div
      class="modal"
      data-modal="skills"
      role="dialog"
      aria-modal="true"
      aria-labelledby="t-skills"
      hidden
    >
      <article class="panel">
        <header class="panel__cabecera">
          <h2 class="panel__titulo" id="t-skills">Skills</h2>
          <button
            class="panel__cerrar"
            type="button"
            data-cerrar
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div class="panel__cuerpo" id="skills-cuerpo"></div>
      </article>
    </div>

    <div
      class="modal"
      data-modal="contact"
      role="dialog"
      aria-modal="true"
      aria-labelledby="t-contact"
      hidden
    >
      <article class="panel">
        <header class="panel__cabecera">
          <h2 class="panel__titulo" id="t-contact">Contact</h2>
          <button
            class="panel__cerrar"
            type="button"
            data-cerrar
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div class="panel__cuerpo" id="contact-cuerpo"></div>
      </article>
    </div>

    <!-- Capa de UI fija -->
    <div class="ui-capa">
      <div class="ui-controles">
        <button
          class="ui-boton"
          id="btn-audio"
          type="button"
          data-estado="alterno"
          aria-pressed="false"
          aria-label="Activar música"
        >
          <svg
            class="icono-base"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
            <path d="M16.2 9.2a4 4 0 0 1 0 5.6" />
            <path d="M18.8 6.6a7.6 7.6 0 0 1 0 10.8" />
          </svg>
          <svg
            class="icono-alterno"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
            <path d="m16.5 9.5 5 5" />
            <path d="m21.5 9.5-5 5" />
          </svg>
        </button>

        <button
          class="ui-boton"
          id="btn-tema"
          type="button"
          data-estado="activo"
          aria-pressed="false"
          aria-label="Cambiar a modo noche"
        >
          <svg
            class="icono-base"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"
            />
          </svg>
          <svg
            class="icono-alterno"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" />
            <path d="M17.5 3v3M16 4.5h3" />
          </svg>
        </button>
      </div>
    </div>
    <audio id="musica" src="/audio/ambiente.mp3" loop preload="none"></audio>

    <!-- Velo que tapa el corte al intercambiar texturas -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
